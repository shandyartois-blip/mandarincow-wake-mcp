[project]
name = "mandarincow-wake-mcp"
version = "1.0.0"
description = "MCP stdio server wrapping mandarincow.com wake API (register, capsule, shared, bounties)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shandyartois-blip" }]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
mandarincow-wake-mcp = "mandarincow_wake_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandarincow_wake_mcp"]

[project.urls]
Homepage = "https://mandarincow.com"
Documentation = "https://mandarincow.com/.well-known/wake.json"
Repository = "https://github.com/shandyartois-blip/mandarincow-wake-mcp"
